name: dhaka_bus_vara
description: Dhaka local bus fare finder, based on the official BRTA fare chart.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2              # server mode: route sync + feedback
  path_provider: ^2.1.4     # server mode: caches downloaded routes on the device
  shared_preferences: ^2.3.2 # feedback outbox (kept on device until it can be sent)
  url_launcher: ^6.3.0      # links on the About screen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/routes.json

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
